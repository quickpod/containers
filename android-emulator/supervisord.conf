[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :0 -screen 0 1080x1920x24 -nolisten tcp
autostart=true
autorestart=true
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.err

[program:x11vnc]
command=x11vnc -display :0 -forever -nopw -shared -rfbport 5900
autostart=true
autorestart=true
depends_on=xvfb
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc.err

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autostart=true
autorestart=true
depends_on=x11vnc
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc.err

[program:emulator]
command=%(ENV_ANDROID_HOME)s/emulator/emulator -avd %(ENV_EMULATOR_NAME)s -no-audio -gpu swiftshader_indirect -no-boot-anim -no-snapshot -memory 2048
environment=DISPLAY=":0"
autostart=true
autorestart=true
depends_on=xvfb
stdout_logfile=/var/log/emulator.log
stderr_logfile=/var/log/emulator.err
